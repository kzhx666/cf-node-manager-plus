<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全登录 - CF 优选 Pro 节点管理中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 12%, #181d33 0%, #090d16 65%, #05070c 100%);
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(99, 102, 241, 0.25);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.45);
      --success: #10b981;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --input-bg: rgba(15, 23, 42, 0.78);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Atmosphere Lights */
    body::before {
      content: "";
      position: absolute;
      top: -15%;
      left: 25%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, transparent 70%);
      filter: blur(85px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: absolute;
      bottom: -15%;
      right: 25%;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.09) 0%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 38px 32px 30px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75),
                  0 0 35px rgba(99, 102, 241, 0.14);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #38bdf8, #10b981);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.28);
      animation: pulseGlow 4s infinite ease-in-out;
      font-size: 1.9rem;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .security-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: dotPulse 2s infinite ease-in-out;
    }

    .alert-box {
      display: none;
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.84rem;
      color: #fca5a5;
      line-height: 1.45;
      animation: shake 0.4s ease-in-out;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 13px 44px 13px 16px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .form-input:focus {
      border-color: var(--input-focus);
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25),
                  0 0 15px rgba(99, 102, 241, 0.15);
    }

    .input-icon-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .input-icon-btn:hover {
      color: var(--text-main);
    }

    .form-extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 0.82rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.38);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.48);
      filter: brightness(1.08);
    }

    .btn-submit:active {
      transform: translateY(1px);
      box-shadow: 0 3px 10px rgba(99, 102, 241, 0.25);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .card-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.74rem;
      color: var(--text-dim);
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        border-color: rgba(99, 102, 241, 0.35);
      }
      50% {
        box-shadow: 0 0 32px rgba(99, 102, 241, 0.45);
        border-color: rgba(99, 102, 241, 0.6);
      }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="logo-badge">⚡</div>
        <h1 class="brand-title">CF 优选<span>Pro</span></h1>
        <p class="brand-subtitle">节点管理与多客户端订阅中心</p>
        <div class="security-status">
          <span class="status-dot"></span>
          安全防护网关已启用
        </div>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <form id="login-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="password">管理员登录密码</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="请输入管理员登录密码..." required autofocus autocomplete="current-password">
            <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('password', this)" title="显示/隐藏密码">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-extra">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" checked>
            <span>保持 30 天登入状态</span>
          </label>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          安全登入控制台
        </button>
      </form>

      <div class="card-footer">
        <div class="footer-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          HMAC-SHA256
        </div>
        <div class="footer-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          防爆破限速
        </div>
        <div class="footer-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          防端口嗅探
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }
    }

    function showAlert(msg) {
      const box = document.getElementById('alert-box');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideAlert() {
      const box = document.getElementById('alert-box');
      box.style.display = 'none';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('btn-submit');
      const originalText = btn.innerHTML;
      const pwd = document.getElementById('password').value;
      const remember = document.getElementById('remember-me') ? document.getElementById('remember-me').checked : true;

      if (!pwd) {
        showAlert('请输入登录密码');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '正在验证安全凭据...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd, remember: remember })
        });
        const data = await res.json();
        if (data.status === 'success' || data.success) {
          btn.innerHTML = '✅ 验证通过，正在跳转...';
          setTimeout(() => {
            const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';
            window.location.href = nextUrl;
          }, 400);
        } else {
          showAlert(data.msg || data.message || '密码错误，请重新输入');
          btn.disabled = false;
          btn.innerHTML = originalText;
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        showAlert(`网络请求异常: ${err.message}`);
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
